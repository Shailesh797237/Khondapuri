amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    laser_model_type: "likelihood_field"

    max_beams: 60
    laser_max_range: 100.0
    laser_min_range: 0.2

    min_particles: 1000
    max_particles: 4000

    pf_err: 0.05
    pf_z: 0.99

    update_min_d: 0.15
    update_min_a: 0.1

    resample_interval: 1

    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05

    sigma_hit: 0.2

    tf_broadcast: true
    transform_tolerance: 2.0

    scan_topic: /scan


bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667

    default_bt_xml_filename: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml


controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"

    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      # Allow robot to ignore orientation at goal
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 6.28

      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.15

      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.0

      lookahead_time: 1.5

      rotate_to_heading_angular_vel: 0.0

      use_velocity_scaled_lookahead_dist: true

      transform_tolerance: 0.2

      use_collision_detection: false

      allow_reversing: false


local_costmap:
  local_costmap:
    ros__parameters:

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      width: 3
      height: 3

      resolution: 0.05

      robot_radius: 0.22

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"

        enabled: True

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          clearing: True
          marking: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.30
        cost_scaling_factor: 3.0


global_costmap:
  global_costmap:
    ros__parameters:

      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05

      track_unknown_space: true

      plugins: ["static_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.55
        cost_scaling_factor: 3.0


map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/shailesh/ekf_ws/src/my_robot_description/rviz/taikisha.yaml"


planner_server:
  ros__parameters:
    use_sim_time: False

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

      tolerance: 0.5

      use_astar: false

      allow_unknown: true


recoveries_server:
  ros__parameters:

    recovery_plugins: ["spin", "back_up", "wait"]

    spin:
      plugin: "nav2_recoveries/Spin"

    back_up:
      plugin: "nav2_recoveries/BackUp"

    wait:
      plugin: "nav2_recoveries/Wait"









