# ================================================================
#  tag_sequence.yaml
#  Defines the physical linear order of all tags and curve waypoints.
#  The navigation stack uses this sequence to parse "tagX to tagY"
#  ranges and automatically generate the correct path.
#  For a closed loop the first tag is repeated at the end.
# ================================================================

ordered_tags:
  - st1
  - way1
  - way2
  - st2
  - st3
  - way3
  - way4
  - st4
  - st1
