# ================================================================
#  missions.yaml  — Multiple waypoint missions in ONE file
#
#  HOW IT WORKS:
#  1. Navigation starts → robot is IDLE (no waypoints loaded)
#  2. You select a mission at runtime:
#     ros2 topic pub --once /load_mission std_msgs/msg/String "data: 'mission_A'"
#  3. Robot loads those waypoints → waits for /set_cycles to start
#  4. When done (or anytime), load a DIFFERENT mission:
#     ros2 topic pub --once /load_mission std_msgs/msg/String "data: 'mission_B'"
#
#  AVAILABLE MISSIONS:
#    - mission_A   : Main rectangular loop
#    - mission_B   : Short test path
#    - mission_C   : Station delivery route
#    - home         : Go back to origin
#
#  ADD YOUR OWN: just add a new key under "missions:" with waypoints list
# ================================================================

missions:

  # ── Mission A: Main rectangular loop ───────────────────────────
  mission_A:
    description: "Main rectangular loop path"
    waypoints:
      - x:          -0.79
        y:           0.01
        theta:       0.016
        type:        waypoint
        mission:     forward
        rotation:    auto

      - x:           8.48
        y:           0.16
        theta:       1.55
        type:        waypoint
        mission:     forward
        rotation:    auto

      - x:           8.57
        y:           7.80
        theta:       3.14
        type:        waypoint
        mission:     forward
        rotation:    auto

      - x:           -7.14
        y:           7.60
        theta:       4.72
        type:        waypoint
        mission:     forward
        rotation:    auto

      - x:           -7.07
        y:           0.10
        theta:       6.26
        type:        waypoint
        mission:     forward
        rotation:    auto

  # ── Mission B: Short test path ─────────────────────────────────
  mission_B:
    description: "Short test path - 2 waypoints"
    waypoints:
      - x:           0.0
        y:           0.0
        theta:       1.57
        type:        waypoint
        mission:     forward
        rotation:    auto

      - x:           0.0
        y:           1.5
        theta:       0.0
        type:        waypoint
        mission:     forward
        rotation:    auto

      - x:           3.0
        y:           1.5
        theta:       -1.57
        type:        waypoint
        mission:     forward
        rotation:    auto

  # ── Mission C: Station delivery route ──────────────────────────
  mission_C:
    description: "Delivery route with PLC station stops"
    waypoints:
      - x:           0.0
        y:           0.0
        theta:       1.57
        type:        waypoint
        mission:     forward
        rotation:    auto

      - x:           0.0
        y:           1.5
        theta:       0.0
        type:        waypoint
        mission:     forward
        rotation:    auto

      - x:           3.0
        y:           1.5
        theta:       -1.57
        type:        station
        mission:     forward
        rotation:    auto
        name:        "STATION_A"
        plc_feedback: "I0.1"

      - x:           3.0
        y:           0.0
        theta:       3.14
        type:        waypoint
        mission:     forward
        rotation:    auto

      - x:           0.0
        y:           0.0
        theta:       0.0
        type:        waypoint
        mission:     forward
        rotation:    auto

  # ── Home: Go back to origin ────────────────────────────────────
  home:
    description: "Return to home position"
    waypoints:
      - x:           0.0
        y:           0.0
        theta:       0.0
        type:        waypoint
        mission:     forward
        rotation:    auto
