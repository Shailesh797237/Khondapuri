  # ================================================================
#  waypoints.yaml  — Rectangle path with one PLC station
#
#  Flow:
#    WP0: rotate to face North (y+)
#    WP1: drive North to (0, 1.5)
#    WP2: rotate East, drive East to (3.0, 1.5)
#    WP3: rotate South, drive South to (3.0, 0.0)  ← STATION_A
#    WP4: rotate West, drive West back to (0.0, 0.0)
#
#  PLC trigger:
#    WP3 is type:station — robot stops, IPC sends command to PLC
#    PLC runs its own program → sets I0.1 = TRUE when done
#    IPC reads I0.1 → TRUE → robot moves on
# ================================================================

waypoints:

  # # ── WP0: Rotate to face North ────────────────────────────────
  # - x:           0.0
  #   y:           0.0
  #   theta:       1.57        # face North (90°)
  #   type:        waypoint
  #   mission:     forward
  #   rotation:    auto

  # # ── WP1: Drive North, then face East ─────────────────────────
  # - x:           0.0
  #   y:           1.5
  #   theta:       0.0         # face East (0°)
  #   type:        waypoint
  #   mission:     forward
  #   rotation:    auto

  # # ── WP2: Drive East ───────────────────────────────────────────
  # - x:           3.0
  #   y:           1.5
  #   theta:       -1.57       # face South (-90°)
  #   type:        waypoint
  #   mission:     forward
  #   rotation:    auto

  # # ── WP3: Drive South → STATION_A ─────────────────────────────
  # #  Robot arrives → IPC writes DB21.DBW4 = 1 to PLC
  # #  PLC ladder reads 1 → runs its program → controls Q outputs
  # #  PLC sets DB21.DBX6.1 = TRUE when done
  # #  IPC reads I0.1 = TRUE → publishes /plc_done → robot moves on
  # - x:           3.0
  #   y:           0.0
  #   theta:       3.14        # face West (180°)
  #   type:        station     # ← triggers PLC bridge
  #   mission:     forward
  #   rotation:    auto
  #   name:        "STATION_A" # matches command_map in station_map.yaml
  #   plc_feedback: "I0.1"    # IPC reads DB21.DBX6.1 — PLC sets when done

  # # ── WP4: Drive West back to start ────────────────────────────
  # - x:           0.0
  #   y:           0.0
  #   theta:       0.0         # face East at home
  #   type:        waypoint
  #   mission:     forward
  #   rotation:    auto



