# ================================================================
#  waypoints.yaml
#  Define your robot path here.
#
#  HOW IT WORKS:
#  - Robot reads each waypoint one by one
#  - If x,y changes  → robot DRIVES STRAIGHT to that x,y
#  - If only theta changes → robot ROTATES in place
#  - theta in radians:
#       0.0   = facing +X (East)
#       1.57  = facing +Y (North)  → anticlockwise 90°
#      -1.57  = facing -Y (South)  → clockwise 90°
#       3.14  = facing -X (West)   → 180° turn
#
#  EXAMPLE BELOW: Square path
#  ================================================================

# waypoints:

#   # ── Leg 1: Go straight along Y axis ──────────────────────────
#   - x: 0.0
#     y: 0.0
#     theta: 1.57        # face North first

#   - x: 0.0
#     y: 1.5
#     theta: 1.57        # go straight North 5m

#   # ── Corner 1: Rotate to face East ────────────────────────────
#   - x: 0.0
#     y: 1.5
#     theta: 0.0         # rotate 90° clockwise to face East

#   # ── Leg 2: Go straight along X axis ──────────────────────────
#   - x: 3.0
#     y: 1.5
#     theta: 0.0         # go straight East 5m

  # # ── Corner 2: Rotate to face South ───────────────────────────
  # - x: 3.0
  #   y: 1.5
  #   theta: -1.57       # rotate clockwise to face South

  # # ── Leg 3: Go straight South ─────────────────────────────────
  # - x: 3.0
  #   y: 0.0
  #   theta: -1.57       # go straight South 5m

  # # ── Corner 3: Rotate to face West ────────────────────────────
  # - x: 3.0
  #   y: 0.0
  #   theta: 3.14        # rotate to face West

  # # ── Leg 4: Return to start ────────────────────────────────────
  # - x: 0.0
  #   y: 0.0
  #   theta: 3.14        # go straight West back to start

  # # ── Final: Rotate back to original heading ────────────────────
  # - x: 0.0
  #   y: 0.0
  #   theta: 1.57         # rotate back to face East (original)

  # - x: 3.0
  #   y: 1.5
  #   theta: 0.0        # go straight North 5m
   


